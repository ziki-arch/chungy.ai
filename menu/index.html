<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- No maximum-scale or user-scalable=no: pinch-to-zoom must keep working,
     because that's how guests will read small print on an image menu. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brunch menu</title>
<meta name="description" content="What's on the table this morning.">
<meta name="theme-color" content="#F2EFE9">
<meta name="robots" content="noindex">
 
<meta property="og:type" content="website">
<meta property="og:title" content="Brunch menu">
<meta property="og:description" content="What's on the table this morning.">
<meta property="og:url" content="https://www.chungy.ai/menu">
<meta property="og:image" content="https://www.chungy.ai/menu/menu.png">
 
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8D%B3</text></svg>">
 
<style>
:root {
  /* Set this to match your image's background so the page looks seamless. */
  --bg: #F2EFE9;
}
 
* { box-sizing: border-box; }
 
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
}
 
body {
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
 
.menu {
  display: block;
  width: 100%;
  max-width: 900px;   /* keeps it from stretching absurdly on a laptop */
  height: auto;
  margin: 0 auto;
}
</style>
</head>
 
<body>
  <img class="menu" src="menu.png"
       alt="Brunch menu: pancakes, eggs, bacon, potatoes, fruit, coffee and juice. Ask the host for the full list or for anything with allergens."
       width="1400" height="2000">
</body>
</html>
